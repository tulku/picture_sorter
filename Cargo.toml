[package]
name = "photo_sorter"
version = "0.1.0"
edition = "2024"
default-run = "photo_sorter"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
indicatif = "0.18.0"
rayon = "1.7"
regex = "1.10"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.8.7"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
toml = "0.8"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
libc = "0.2.190"

[dev-dependencies]
tempfile = "3.27.0"
